name: Gerar documento
run-name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run python src/gerar.py
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice-writer python3-uno
      - run: /usr/bin/python3 src/sumario.py "projeto/Projeto - Maria Eduarda.docx"
      - uses: actions/upload-artifact@v4
        with:
          name: projeto
          path: "projeto/Projeto - Maria Eduarda.docx"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "projeto/Projeto - Maria Eduarda.docx"
          git commit -m "Atualiza documento gerado" || exit 0
          git push
