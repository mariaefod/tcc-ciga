[project]
name = "tcc-ciga"
version = "0.1.0"
description = "Documentação de monografia"
authors = [{ name = "Maria Eduarda Ferreira Oliveira Duque" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "mkslides>=2.0.15,<3",
    "taskipy>=1.14.1,<2",
    "pyyaml (>=6.0)",
]

[tool.poetry]
package-mode = false

[tool.taskipy.tasks]
serve = { cmd = "cp -r assets slides/ && mkslides serve", help = "Mostra os slides localmente." }
build = { cmd = "cp -r assets slides/ && mkslides build", help = "Gera os slides na pasta site/." }
